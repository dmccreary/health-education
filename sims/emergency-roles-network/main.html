<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
<!-- CANVAS_HEIGHT: 540 -->
<title>Emergency Roles Network</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { font-family: Arial, Helvetica, sans-serif; background: white; }
  main { display: block; width: 100%; padding: 8px; }
  h3 { text-align: center; color: navy; font-size: 17px; margin: 2px 0; }
  .subtitle { text-align: center; color: dimgray; font-size: 12px; margin-bottom: 6px; }
  .wrap { position: relative; }
  #network { width: 100%; height: 400px; border: 1px solid silver; border-radius: 6px; background: aliceblue; }
  .legend { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.92); border: 1px solid #cbd5e1; border-radius: 5px; padding: 6px 8px; font-size: 11px; line-height: 1.6; }
  .legend .k { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: middle; border: 1px solid #555; }
  .infobox { margin-top: 8px; background: #f8fafc; border-left: 4px solid seagreen; border-radius: 4px; padding: 8px 10px; font-size: 13px; color: #334155; line-height: 1.45; min-height: 66px; }
  .infobox strong { color: navy; }
</style>
</head>
<body>
<main>
  <h3>Who Helps Keep Everyone Safe?</h3>
  <div class="subtitle">Hover any circle for a quick idea. Click an orange role to see its branch, or click the green goal to reset.</div>
  <div class="wrap">
    <div id="network"></div>
    <div class="legend">
      <span class="k" style="background:seagreen;"></span>Shared goal<br>
      <span class="k" style="background:darkorange;"></span>Role category<br>
      <span class="k" style="background:#d9dee3;"></span>Specific action
    </div>
  </div>
  <div class="infobox" id="infobox">During a school emergency, three groups each do their part. Their actions all lead to one shared goal: everyone safe.</div>
</main>
<script>
const box = document.getElementById('infobox');

// Data model: one goal, three roles, and each role's specific actions.
const roles = [
  { id:'individual', label:'Individual\nActions',
    hover:'Things you can do yourself to stay safe.',
    detail:'Individual actions are the choices you make on your own during an emergency. Staying calm and following the plan helps you and the people around you.',
    leaves:[
      { id:'i1', label:'Follow drill\nprocedures', hover:'Do the steps you practiced in drills.',
        detail:'Following the drill steps you practiced means you already know what to do, so you can act quickly and calmly.' },
      { id:'i2', label:'Move\ncalmly', hover:'Walk, do not run or push.',
        detail:'Moving calmly keeps the path clear and prevents falls or crowding, so everyone can get to a safe place.' },
      { id:'i3', label:'Listen for\ninstructions', hover:'Pay attention to trusted adults.',
        detail:'Listening carefully for instructions helps you follow the safest plan, even if it changes during the emergency.' }
    ] },
  { id:'peer', label:'Peer\nActions',
    hover:'Ways you can help your classmates.',
    detail:'Peer actions are the ways students help each other. A small act of kindness or a quick report can make a big difference for a classmate.',
    leaves:[
      { id:'p1', label:'Help a scared\nclassmate', hover:'Offer calm words to a worried friend.',
        detail:'Helping a scared classmate with calm, kind words can help them stay steady and follow the plan too.' },
      { id:'p2', label:'Report someone\nmissing', hover:'Tell an adult if a friend is not there.',
        detail:'Reporting a missing classmate to a trusted adult helps make sure no one is left behind or forgotten.' },
      { id:'p3', label:'Stay with\nyour group', hover:'Keep the group together.',
        detail:'Staying with your group means adults can count everyone and no one gets separated during the emergency.' }
    ] },
  { id:'staff', label:'School-Staff\nActions',
    hover:'The important jobs adults at school do.',
    detail:'School-staff actions are the responsibilities teachers and staff carry out. Adults guide the plan and check that every student is accounted for.',
    leaves:[
      { id:'s1', label:'Take\nattendance', hover:'Count students to find everyone.',
        detail:'Taking attendance lets staff confirm that every student is present and quickly notice if someone is missing.' },
      { id:'s2', label:'Secure\nclassrooms', hover:'Make the room safe.',
        detail:'Securing classrooms, such as locking doors when needed, helps keep students protected until it is safe again.' },
      { id:'s3', label:'Guide students\nto safety', hover:'Lead the group to a safe spot.',
        detail:'Guiding students to safety means adults lead the way to a safe location and keep the group calm and together.' }
    ] },
  { id:'plan', label:'', hidden:true } // placeholder removed below; kept for clarity
];
roles.pop(); // remove placeholder

const nodes = [], edges = [];
const info = {};        // id -> { title, text }
const hovers = {};      // id -> one-line string
const branch = {};      // roleId -> [node ids in that branch]

// Central shared-goal node (bottom of hierarchy)
info['goal'] = { title:'Everyone Safe', text:'The shared goal of every emergency plan. All of the actions by students and staff work together so that everyone stays safe.' };
hovers['goal'] = 'The shared goal all actions lead to.';
nodes.push({ id:'goal', label:'Everyone\nSafe', level:0, shape:'ellipse',
  color:{ background:'seagreen', border:'#1e6b45', highlight:{ background:'seagreen', border:'#1e6b45' } },
  font:{ color:'white', size:17, bold:{ color:'white' } }, borderWidth:3 });

roles.forEach(r => {
  branch[r.id] = [r.id];
  info[r.id] = { title:r.label.replace(/\n/g,' '), text:r.detail };
  hovers[r.id] = r.hover;
  // Role node (middle row)
  nodes.push({ id:r.id, label:r.label, level:1, shape:'ellipse',
    color:{ background:'darkorange', border:'#b25e00', highlight:{ background:'darkorange', border:'#b25e00' } },
    font:{ color:'white', size:14, bold:{ color:'white' } }, borderWidth:2 });
  // Green arrow: role -> goal
  edges.push({ id:'e_'+r.id, from:r.id, to:'goal', arrows:'to',
    color:{ color:'seagreen', highlight:'seagreen' }, width:3 });
  r.leaves.forEach(lf => {
    branch[r.id].push(lf.id);
    info[lf.id] = { title:lf.label.replace(/\n/g,' '), text:lf.detail };
    hovers[lf.id] = lf.hover;
    // Leaf node (top row)
    nodes.push({ id:lf.id, label:lf.label, level:2, shape:'box', margin:7,
      color:{ background:'#d9dee3', border:'#9aa4ad', highlight:{ background:'#eef1f4', border:'#9aa4ad' } },
      font:{ color:'#2b3138', size:12 }, borderWidth:1 });
    // Gray arrow: leaf -> role
    edges.push({ id:'e_'+lf.id, from:lf.id, to:r.id, arrows:'to',
      color:{ color:'#9aa4ad', highlight:'#9aa4ad' }, width:2 });
  });
});

const container = document.getElementById('network');
const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
const options = {
  layout: { hierarchical: { enabled:true, direction:'DU', sortMethod:'directed',
            levelSeparation:120, nodeSpacing:120, treeSpacing:170 } },
  physics: false,
  interaction: { hover:true, dragView:true, zoomView:false, navigationButtons:true, tooltipDelay:100000 },
  edges: { smooth:{ type:'cubicBezier', forceDirection:'vertical', roundness:0.5 } },
  nodes: { shadow:true }
};
const network = new vis.Network(container, data, options);
network.once('afterDrawing', () => network.fit());

function panel(id){
  const d = info[id];
  if (d) box.innerHTML = '<strong>' + d.title + '</strong><br>' + d.text;
}

// Dim everything except the chosen role's branch (nodes + connecting edges).
function highlightBranch(roleId){
  const keep = new Set(branch[roleId]);
  keep.add('goal');
  data.nodes.forEach(n => {
    const on = keep.has(n.id);
    data.nodes.update({ id:n.id, opacity: on ? 1 : 0.18,
      font:{ color: on ? (n.id==='goal'||roles.some(r=>r.id===n.id) ? 'white' : '#2b3138') : 'rgba(120,120,120,0.35)' } });
  });
  data.edges.forEach(e => {
    const on = keep.has(e.from) && keep.has(e.to);
    data.edges.update({ id:e.id, hidden:!on });
  });
}

function resetView(){
  data.nodes.forEach(n => {
    data.nodes.update({ id:n.id, opacity:1,
      font:{ color: (n.id==='goal'||roles.some(r=>r.id===n.id)) ? 'white' : '#2b3138' } });
  });
  data.edges.forEach(e => data.edges.update({ id:e.id, hidden:false }));
}

network.on('hoverNode', p => { const h = hovers[p.node]; if (h) box.innerHTML = h; });
network.on('click', p => {
  if (!p.nodes.length) return;
  const id = p.nodes[0];
  panel(id);
  if (roles.some(r => r.id === id)) highlightBranch(id);
  else if (id === 'goal') resetView();
});
</script>
</body>
</html>
