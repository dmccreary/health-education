<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
<!-- CANVAS_HEIGHT: 540 -->
<title>Brain Health Factor Explorer</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { font-family: Arial, Helvetica, sans-serif; background: white; }
  main { display: block; width: 100%; padding: 8px; }
  h3 { text-align: center; color: navy; font-size: 17px; margin: 2px 0; }
  .subtitle { text-align: center; color: dimgray; font-size: 12px; margin-bottom: 6px; }
  .wrap { position: relative; }
  #network { width: 100%; height: 400px; border: 1px solid silver; border-radius: 6px; background: aliceblue; }
  .legend { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); border: 1px solid #cbd5e1; border-radius: 5px; padding: 6px 8px; font-size: 11px; line-height: 1.6; }
  .legend .k { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: middle; border: 1px solid #555; }
  .infobox { margin-top: 8px; background: #f8fafc; border-left: 4px solid steelblue; border-radius: 4px; padding: 8px 10px; font-size: 13px; color: #334155; line-height: 1.45; min-height: 66px; }
  .infobox strong { color: navy; }
</style>
</head>
<body>
<main>
  <h3>What Keeps a Brain Healthy?</h3>
  <div class="subtitle">Hover any node for a quick description. Click a green factor or orange pathway for the evidence behind it.</div>
  <div class="wrap">
    <div id="network"></div>
    <div class="legend">
      <span class="k" style="background:#5b9bd5;"></span>Core idea<br>
      <span class="k" style="background:#66bb6a;"></span>Factor<br>
      <span class="k" style="background:#ffa726;transform:rotate(45deg);"></span>How it works<br>
      <span class="k" style="background:#e3f2fd;"></span>Example habit
    </div>
  </div>
  <div class="infobox" id="infobox">Five habits you control help your brain stay healthy. Explore how each one works and see real examples.</div>
</main>
<script>
const box = document.getElementById('infobox');
const factors = [
  { id:'phys', label:'Physical\nActivity', mech:'Increases blood flow\n& neuron connections',
    ex:['Daily walk','Team sports'],
    hover:'Moving your body regularly supports a healthy brain.',
    evidence:'Studies link regular exercise to better memory and attention. Movement raises blood flow to the brain and helps grow new connections between neurons.',
    path:'Physical activity increases blood flow, delivering more oxygen and nutrients, and triggers signals that build new neuron connections.' },
  { id:'nutr', label:'Nutrition', mech:'Supplies nutrients that\nprotect brain cells',
    ex:['Leafy greens','Omega-3 foods'],
    hover:'Eating nourishing foods gives the brain what it needs.',
    evidence:'Diets rich in vegetables, whole grains, and healthy fats are associated with sharper thinking as people age.',
    path:'Nutrients and healthy fats become building blocks for brain cells and help protect them from everyday wear.' },
  { id:'cog', label:'Cognitive\nEngagement', mech:'Builds new neural\npathways',
    ex:['New language','Strategy games'],
    hover:'Challenging your mind keeps it flexible and strong.',
    evidence:'Learning new skills and solving problems is linked to stronger thinking abilities over time.',
    path:'Practicing new and difficult tasks strengthens existing pathways and builds new ones, a property called plasticity.' },
  { id:'soc', label:'Social\nConnection', mech:'Lowers stress and\nstimulates the brain',
    ex:['Time with friends','Clubs or teams'],
    hover:'Spending time with others supports brain health.',
    evidence:'People with strong social ties tend to keep sharper memory and mood as they age.',
    path:'Positive relationships lower stress hormones and give the brain rich, varied stimulation.' },
  { id:'avoid', label:'Avoiding\nHarm', mech:'Protects cells from\ndamage and injury',
    ex:['Wear a helmet','Protect sleep'],
    hover:'Steering clear of harm keeps brain cells safe.',
    evidence:'Protecting the head from injury and getting enough sleep are both tied to long-term brain health.',
    path:'Guarding against injury and getting rest prevents damage and lets the brain repair itself.' }
];

const nodes = [], edges = [];
const info = { center: { title:'Brain-Healthy Habits', text:'Five habits you control &mdash; move, eat well, learn, connect, and avoid harm &mdash; all work together to keep your brain healthy.' } };
nodes.push({ id:'center', label:'Brain-Healthy\nHabits', shape:'ellipse', color:{ background:'#5b9bd5', border:'#2e5f8a' }, font:{ color:'white', size:16, face:'Arial', multi:false }, borderWidth:2 });

factors.forEach(f => {
  nodes.push({ id:f.id, label:f.label, shape:'box', color:{ background:'#66bb6a', border:'#357a38' }, font:{ color:'white', size:14 }, borderWidth:2, margin:8 });
  edges.push({ from:'center', to:f.id, label:'supports', font:{ size:10, color:'#555' }, color:{ color:'#9bb' }, width:2 });
  const mid = f.id + '_m';
  nodes.push({ id:mid, label:f.mech, shape:'diamond', color:{ background:'#ffa726', border:'#c77800' }, font:{ size:11, color:'#3a2600' }, size:22 });
  edges.push({ from:f.id, to:mid, label:'works by', font:{ size:9, color:'#888' }, color:{ color:'#e0b070' }, dashes:true });
  info[mid] = { title:'How it works: ' + f.label.replace('\n',' '), text:f.path };
  info[f.id] = { title:f.label.replace('\n',' '), text:f.evidence };
  f.ex.forEach((e, i) => {
    const eid = f.id + '_e' + i;
    nodes.push({ id:eid, label:e, shape:'dot', size:9, color:{ background:'#e3f2fd', border:'#7fb0d8' }, font:{ size:11, color:'#33475b' } });
    edges.push({ from:f.id, to:eid, color:{ color:'#cdd9e5' }, width:1 });
    info[eid] = { title:'Example: ' + e, text:'A concrete way to practice ' + f.label.replace('\n',' ').toLowerCase() + '.' };
  });
  info[f.id + '_hover'] = f.hover;
});

const container = document.getElementById('network');
const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
const options = {
  physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -60, springLength: 90 }, stabilization: { iterations: 300 } },
  interaction: { hover: true, dragView: true, zoomView: false, navigationButtons: true, tooltipDelay: 100000 },
  edges: { smooth: { type: 'continuous' }, arrows: { to: { enabled: true, scaleFactor: 0.5 } } },
  nodes: { shadow: true }
};
const network = new vis.Network(container, data, options);
network.once('stabilizationIterationsDone', () => { network.setOptions({ physics: false }); network.fit(); });

function panel(id){
  const d = info[id];
  if (d) box.innerHTML = '<strong>' + d.title + '</strong><br>' + d.text;
}
network.on('hoverNode', p => { const h = info[p.node + '_hover']; if (h) box.innerHTML = h; });
network.on('click', p => { if (p.nodes.length) panel(p.nodes[0] === 'center' ? 'center' : p.nodes[0]); });
</script>
</body>
</html>
