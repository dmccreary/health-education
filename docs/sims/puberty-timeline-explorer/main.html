<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
<!-- CANVAS_HEIGHT: 500 -->
<title>Everyone's Timeline Looks Different</title>
<script src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
<link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { font-family: Arial, Helvetica, sans-serif; background: white; }
  main { display: block; width: 100%; padding: 10px; }
  h3 { text-align: center; color: navy; font-size: 20px; margin: 2px 0; }
  .subtitle { text-align: center; color: dimgray; font-size: 14px; margin-bottom: 8px; }
  #timeline { border: 1px solid silver; border-radius: 6px; background: aliceblue; }
  /* Soft, warm, non-clinical colors for each person's "changes begin" marker */
  .vis-item.personA { background-color: #bfe3c0; border-color: seagreen; color: #12401a; }
  .vis-item.personB { background-color: #bcd8f5; border-color: steelblue; color: #10314f; }
  .vis-item.personC { background-color: #f7e6a8; border-color: goldenrod; color: #5a4a10; }
  .vis-item.personD { background-color: #d8cef0; border-color: mediumpurple; color: #35235a; }
  .vis-item.personE { background-color: #f6cfa0; border-color: darkorange; color: #5a3410; }
  .vis-item { font-size: 14px; font-weight: bold; }
  .vis-item.vis-line { width: 3px; }
  .vis-item.vis-dot { border-width: 8px; }
  .vis-labelset .vis-label { font-size: 15px; font-weight: bold; color: navy; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: stretch; }
  .infobox { flex: 2; background: #f8fafc; border-left: 5px solid seagreen; border-radius: 4px; padding: 10px 12px; font-size: 15px; color: #334155; line-height: 1.5; min-height: 80px; }
  .infobox strong { color: navy; }
  button { flex: 1; background: seagreen; color: white; border: none; border-radius: 5px; padding: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
  button:hover { background: #1f6b47; }
</style>
</head>
<body>
<main>
  <h3>Everyone's Timeline Looks Different</h3>
  <div class="subtitle">Each row is a different person. Click a dot to see when their body started to change.</div>
  <div id="timeline"></div>
  <div class="row">
    <div class="infobox" id="infobox">Every person grows on their own timeline. Click any colored dot &mdash; or the button &mdash; to learn more.</div>
    <button id="sameBtn">Where's the same age for everyone?</button>
  </div>
</main>
<script>
// Map an age (in years) to a date so vis-timeline can plot it: age N -> Jan 1 of year 2000+N.
function age(y){ return new Date(2000 + y, 0, 1); }

// The same reassuring message appears for every person's marker.
var markerMsg = '<strong>This is just one example.</strong> There is no "right" age for puberty to begin &mdash; every person\'s timeline is different, and that\'s normal.';
var sameMsg = '<strong>There isn\'t one!</strong> That\'s the whole point &mdash; every body has its own timeline.';

var info = {
  A: markerMsg, B: markerMsg, C: markerMsg, D: markerMsg, E: markerMsg
};
var box = document.getElementById('infobox');

// One point marker per person, each at a different age. Rows span roughly ages 8-14.
var items = new vis.DataSet([
  { id: 'A', group: 0, content: 'changes begin', start: age(9),  type: 'point', className: 'personA' },
  { id: 'B', group: 1, content: 'changes begin', start: age(11), type: 'point', className: 'personB' },
  { id: 'C', group: 2, content: 'changes begin', start: age(13), type: 'point', className: 'personC' },
  { id: 'D', group: 3, content: 'changes begin', start: age(10), type: 'point', className: 'personD' },
  { id: 'E', group: 4, content: 'changes begin', start: age(12), type: 'point', className: 'personE' }
]);
var groups = new vis.DataSet([
  { id: 0, content: 'Person A' },
  { id: 1, content: 'Person B' },
  { id: 2, content: 'Person C' },
  { id: 3, content: 'Person D' },
  { id: 4, content: 'Person E' }
]);
var options = {
  min: age(8), max: age(14), start: age(8), end: age(14),
  zoomable: false, moveable: false, showCurrentTime: false, selectable: true, stack: false,
  margin: { item: 10, axis: 12 },
  format: {
    minorLabels: function(d){ return 'Age ' + ((typeof d.getFullYear === 'function' ? d.getFullYear() : d.year()) - 2000); },
    majorLabels: function(){ return ''; }
  },
  timeAxis: { scale: 'year', step: 1 }
};
var tl = new vis.Timeline(document.getElementById('timeline'), items, groups, options);
tl.on('select', function(p){ if (p.items.length && info[p.items[0]]) box.innerHTML = info[p.items[0]]; });
document.getElementById('sameBtn').addEventListener('click', function(){ box.innerHTML = sameMsg; });
</script>
</body>
</html>
